    <text x="105" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Python + SQLite Local DB</text>
    <line x1="20" y1="138" x2="190" y2="138" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="30" y="160" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">💾 Time-Series Readings</text>
    <text x="30" y="182" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">📊 Fleet PR Calculation</text>
    <text x="30" y="204" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">☀️ Irradiance Curve Fit</text>
    <text x="30" y="226" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">⚠️ Fault &amp; Anomaly Triage</text>
  </g>

