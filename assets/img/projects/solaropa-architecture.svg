    <circle cx="100" cy="50" r="24" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M90 54 L100 42 L110 54 M95 50 L105 50" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="100" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">iSolarCloud API</text>
    <text x="100" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">OAuth 2.0 Auth</text>
    <line x1="20" y1="135" x2="180" y2="135" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="30" y="158" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">⚡ Real-time Telemetry</text>
    <text x="30" y="180" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">🔌 Inverter Status</text>
    <text x="30" y="202" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">📈 Power &amp; Daily Yield</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M245 215 L295 215"/>
    <polygon points="295,210 305,215 295,220" fill="#38bdf8"/>
