      <text x="36" y="248">minute readings · alerts</text>
      <text x="36" y="267">maintenance · reports</text>
      <text x="36" y="286">retention &amp; settings</text>

      <rect x="252" y="202" width="216" height="104" rx="10" fill="#0b1220" stroke="#1e293b"/>
      <text x="266" y="226" font-weight="700" fill="#38bdf8">Analytics</text>
      <text x="266" y="248">fleet yield (kWh/kWp)</text>
      <text x="266" y="267">day-over-day trend</text>
      <text x="266" y="286">hourly energy curves</text>

      <rect x="22" y="320" width="446" height="96" rx="10" fill="#0b1220" stroke="#1e293b"/>
      <text x="36" y="344" font-weight="700" fill="#a78bfa">Scheduler &amp; security layer</text>
      <text x="36" y="366">daily / weekly / monthly reports · send-then-mark · catch-up after restart</text>
      <text x="36" y="385">invite + admin approval · read-only viewer role (server-side) · CSRF</text>
      <text x="36" y="404">hashed device tokens &amp; admin password · login rate limiting</text>
