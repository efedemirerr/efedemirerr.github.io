<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d2b"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#161e2b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#9fef00" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="24" width="300" height="34" rx="17" fill="#1a2332" stroke="#9fef00" stroke-width="1.5"/>
  <text x="400" y="46" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#9fef00" text-anchor="middle" letter-spacing="1">SolarOPA · AUTONOMOUS AI ARCHITECTURE</text>

  <!-- Step 1: Sungrow Cloud API -->
  <g transform="translate(40, 100)">
    <rect width="200" height="230" rx="12" fill="url(#cardGrad)" stroke="#2a3547" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#9fef00"/>
    <circle cx="100" cy="50" r="24" fill="#141d2b" stroke="#9fef00" stroke-width="1.5"/>
    <path d="M90 54 L100 42 L110 54 M95 50 L105 50" stroke="#9fef00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="100" y="96" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#e4e9f2" text-anchor="middle">iSolarCloud API</text>
    <text x="100" y="118" font-family="sans-serif" font-size="11" fill="#a4b1cd" text-anchor="middle">OAuth 2.0 Auth</text>
    <line x1="20" y1="135" x2="180" y2="135" stroke="#2a3547" stroke-width="1"/>
    <text x="30" y="158" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">⚡ Real-time Telemetry</text>
    <text x="30" y="180" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">🔌 Inverter Status</text>
    <text x="30" y="202" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">📈 Power &amp; Daily Yield</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g stroke="#9fef00" stroke-width="2" fill="none">
    <path d="M245 215 L295 215" marker-end="url(#arrow)"/>
    <polygon points="295,210 305,215 295,220" fill="#9fef00"/>
  </g>

  <!-- Step 2: Local Core Engine & SQLite -->
  <g transform="translate(305, 90)">
    <rect width="210" height="250" rx="12" fill="url(#cardGrad)" stroke="#9fef00" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="6" rx="3" fill="#9fef00"/>
    <circle cx="105" cy="52" r="26" fill="#141d2b" stroke="#9fef00" stroke-width="1.5"/>
    <text x="105" y="58" font-family="'Fira Code', monospace" font-size="18" fill="#9fef00" text-anchor="middle">&lt;/&gt;</text>
    <text x="105" y="100" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#e4e9f2" text-anchor="middle">Core Engine &amp; DB</text>
    <text x="105" y="120" font-family="sans-serif" font-size="11" fill="#a4b1cd" text-anchor="middle">Python + SQLite Local DB</text>
    <line x1="20" y1="138" x2="190" y2="138" stroke="#2a3547" stroke-width="1"/>
    <text x="30" y="160" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">💾 Time-Series Readings</text>
    <text x="30" y="182" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">📊 Fleet PR Calculation</text>
    <text x="30" y="204" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">☀️ Irradiance Curve Fit</text>
    <text x="30" y="226" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">⚠️ Fault &amp; Anomaly Triage</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g stroke="#9fef00" stroke-width="2" fill="none">
    <path d="M520 215 L570 215"/>
    <polygon points="570,210 580,215 570,220" fill="#9fef00"/>
  </g>

  <!-- Step 3: AI Intelligence & Automated Delivery -->
  <g transform="translate(580, 100)">
    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#2a3547" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#9fef00"/>
    <circle cx="90" cy="50" r="24" fill="#141d2b" stroke="#9fef00" stroke-width="1.5"/>
    <path d="M80 50 Q90 35 100 50 T90 65" stroke="#9fef00" stroke-width="2" fill="none"/>
    <text x="90" y="96" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#e4e9f2" text-anchor="middle">AI &amp; Reporting</text>
    <text x="90" y="118" font-family="sans-serif" font-size="11" fill="#a4b1cd" text-anchor="middle">Gemini LLM &amp; SMTP</text>
    <line x1="15" y1="135" x2="165" y2="135" stroke="#2a3547" stroke-width="1"/>
    <text x="22" y="158" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">🤖 Gemini Reasoning</text>
    <text x="22" y="180" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">📑 HTML Exec Summary</text>
    <text x="22" y="202" font-family="'Fira Code', monospace" font-size="10.5" fill="#a4b1cd">✉️ 20:00 Daily SMTP Email</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="395" font-family="'Fira Code', monospace" font-size="12" fill="#a4b1cd" text-anchor="middle">Fully Autonomous · Closed-Loop Telemetry · Actionable Plant Insights</text>
  <text x="400" y="415" font-family="'Fira Code', monospace" font-size="11" fill="#9fef00" text-anchor="middle">Developed by Efe Demirer &amp; Antigravity AI</text>
</svg>
