  <text x="400" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SolarOPA · AUTONOMOUS AI ARCHITECTURE</text>

  <!-- Step 1: Sungrow Cloud API -->
  <g transform="translate(40, 100)">
