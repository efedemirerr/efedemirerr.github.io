    <text x="22" y="158" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">🤖 Gemini Reasoning</text>
    <text x="22" y="180" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">📑 HTML Exec Summary</text>
    <text x="22" y="202" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">✉️ 20:00 Daily SMTP Email</text>
  </g>

  <!-- Footer Tag -->
  <text x="400" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Fully Autonomous · Closed-Loop Telemetry · Actionable Plant Insights</text>
  <text x="400" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Developed by Efe Demirer &amp; Antigravity AI</text>
</svg>
