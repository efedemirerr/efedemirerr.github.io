  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M520 215 L570 215"/>
    <polygon points="570,210 580,215 570,220" fill="#38bdf8"/>
  </g>

  <!-- Step 3: AI Intelligence & Automated Delivery -->
  <g transform="translate(580, 100)">
    <rect width="180" height="230" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#6366f1"/>
    <circle cx="90" cy="50" r="24" fill="#0b0f19" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M80 50 Q90 35 100 50 T90 65" stroke="#a5b4fc" stroke-width="2" fill="none"/>
    <text x="90" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">AI &amp; Reporting</text>
    <text x="90" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Gemini LLM &amp; SMTP</text>
